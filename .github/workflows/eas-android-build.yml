name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify EAS auth
        run: eas whoami

      - name: Build Android with EAS
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile || 'production' }} \
            --non-interactive \
            --wait

      - name: Get artifact URL
        id: artifact
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          URL=$(eas build:list \
            --platform android \
            --status FINISHED \
            --limit 1 \
            --non-interactive \
            --json 2>/dev/null \
            | jq -r '.[0] | (.artifacts.buildUrl // .artifacts.applicationArchiveUrl)')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Could not retrieve artifact URL from EAS"
            exit 1
          fi

          EXT="aab"
          [ "$PROFILE" = "preview" ] && EXT="apk"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "filename=kachingo-android-${PROFILE}.${EXT}" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        run: |
          mkdir -p dist
          curl -sSL "${{ steps.artifact.outputs.url }}" \
            -o "dist/${{ steps.artifact.outputs.filename }}"
          echo "Downloaded: $(ls -lh dist/)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kachingo-android-${{ inputs.profile || 'production' }}-${{ github.sha }}
          path: mobile/dist/
          retention-days: 30
          if-no-files-found: error
