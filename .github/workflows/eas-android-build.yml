name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: Build Android (local)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Build Android locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          EXT="aab"
          [ "$PROFILE" = "preview" ] && EXT="apk"
          mkdir -p dist
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "dist/kachingo-android.${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kachingo-android-${{ inputs.profile || 'production' }}-${{ github.sha }}
          path: mobile/dist/
          retention-days: 30
          if-no-files-found: error
