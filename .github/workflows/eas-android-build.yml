name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'production' }}"
          mkdir -p dist logs

          if [ "$PROFILE" = "preview" ]; then
            (cd android && ./gradlew assembleRelease --stacktrace --no-daemon) 2>&1 | tee logs/build.log
            cp android/app/build/outputs/apk/release/app-release.apk dist/kachingo-android.apk
          else
            (cd android && ./gradlew bundleRelease --stacktrace --no-daemon) 2>&1 | tee logs/build.log
            cp android/app/build/outputs/bundle/release/app-release.aab dist/kachingo-android.aab
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: mobile/logs/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kachingo-android-${{ inputs.profile || 'production' }}-${{ github.sha }}
          path: mobile/dist/
          retention-days: 30
          if-no-files-found: error
